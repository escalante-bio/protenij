[project]
name = "protenij"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    "biopython>=1.83",
    "biotite>=1.2.0",
    "einops>=0.8.0",
    "equinox>=0.13.0",
    "gemmi>=0.6.5",
    "jax>=0.6.2",
    "ml-collections>=1.1.0",
    "modelcif>=0.7",
    "numpy>=2.1.0",
    "optree>=0.16.0",
    "pandas>=2.3.1",
    "pdbeccdutils>=0.8.5",
    "protobuf==3.20.2",
    "pyyaml>=6.0.2",
    "rdkit>=2025.3.3",
    "safetensors>=0.5.3",
    "scikit-learn>=1.6.0",
    "scipy>=1.15.3",
    "setuptools>=80.9.0",
    "tqdm>=4.67.1",
    "huggingface_hub>=0.20.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.optional-dependencies]
pytorch-cpu = [
  "torch>=2.11.0",
]
pytorch-cu128 = [
  "torch>=2.11.0",
]

[tool.uv]
package = true
override-dependencies = ["nvidia-cudnn-cu12>=9.8"]
conflicts = [
  [
    { extra = "pytorch-cpu" },
    { extra = "pytorch-cu128" },
  ],
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
jax-cuda = [
  "jax[cuda]",
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", extra = "pytorch-cpu" },
  { index = "pytorch-cu128", extra = "pytorch-cu128" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
